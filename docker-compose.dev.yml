# Sviluppo locale: http://localhost:8001 (MariaDB esposto sulla porta 3308)
#
# Stesso schema di unlimiteddb (app php-fpm + nginx + db), con queste differenze:
#   - niente Traefik e niente rete esterna `proxy`: nginx pubblica direttamente la porta 8001;
#   - porte scelte per non collidere con gli altri compose dev: web 8001 (66 unlimiteddb, 88 foto,
#     8000 calendario-cavalcalupi, 8080 notifiche-circolari-baseggio) e MariaDB 3308 (3306 unlimiteddb e
#     notifiche-circolari-baseggio, 3307 foto e calendario-cavalcalupi);
#   - subnet 172.31.0.0/24 (172.20.0.0/24 e' quella di produzione di questo sito);
#   - nessun worker: il sito non usa le code (come in produzione);
#   - `public/build` e' committato in Git e condiviso con l'host: un `npm run build` in locale aggiorna
#     sia app (manifest Vite) sia nginx (file statici).
#
# Comandi:
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml exec app php artisan migrate
#   docker compose -f docker-compose.dev.yml down        (aggiungi -v per cancellare anche il database)
services:
  app:
    build: .
    image: riccardomandich:dev
    container_name: riccardomandich_app_dev
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
      - ./public/build:/var/www/html/public/build
    environment:
      - DB_HOST=db
      - DB_DATABASE=riccardomandich
      - DB_USERNAME=riccardomandich
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      internal:
        ipv4_address: 172.31.0.10
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: riccardomandich_nginx_dev
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    networks:
      - internal
    depends_on:
      - app

  db:
    image: mariadb:11
    container_name: riccardomandich_db_dev
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=riccardomandich
    volumes:
      - db_data_dev:/var/lib/mysql
      - ./docker/mysql/init.dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  db_data_dev:
